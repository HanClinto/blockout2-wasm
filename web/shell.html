<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockOut II</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 4 / 3; image-rendering: auto; outline: none; }
  #status { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="status">Loading…</div>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { statusEl.textContent = t; statusEl.hidden = !t; },
    onRuntimeInitialized: function () { Module.canvas.focus(); },
    blockout: {
      setFullScreen: function (on) {
        if (on && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(function () {});
        if (!on && document.fullscreenElement) document.exitFullscreen();
      },
      quit: function () { history.length > 1 ? history.back() : null; }
    }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
